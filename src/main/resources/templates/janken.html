<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>じゃんけん</title>
  <style>
    .hands {
      display: flex;
      gap: 16px;
      align-items: center;
      margin: 12px 0;
    }

    .hands a img {
      width: 120px;
      height: 120px;
      object-fit: contain;
    }
  </style>
</head>

<body>
  <h1>じゃんけん</h1>

  <!-- 只有從 index 進來（session 有 username）才顯示 Hi -->
  <p th:if="${username != null}">
    Hi <strong th:text="${username}">anon</strong> !
  </p>

  <h3>出す手を選んでください：</h3>
  <div class="hands">
    <a href="/play?hand=rock" title="グー"><img src="/img/rock.png" alt="グー" /></a>
    <a href="/play?hand=scissors" title="チョキ"><img src="/img/scissors.png" alt="チョキ" /></a>
    <a href="/play?hand=paper" title="パー"><img src="/img/paper.png" alt="パー" /></a>
  </div>

  <hr />

  <!-- クリックするまでは結果を表示しない -->
  <div th:if="${you != null}">
    <p>あなたの手：<strong th:text="${you}">YOU</strong></p>
    <p>相手の手　：<strong th:text="${cpu}">CPU</strong></p>
    <p>結果　　　：<strong th:text="${result}">RESULT</strong></p>
  </div>

  <p><a href="/">トップへ戻る</a></p>
</body>

</html>
