<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <title>じゃんけん</title>
</head>

<body>

  <!-- 登入中のユーザ名（Thymeleaf + Spring Security） -->
  <p>ログインユーザ：<span sec:authentication="name">anonymous</span></p>
  <p><a href="/logout">ログアウト</a></p>

  <!-- 只有從 /janken（經由 controller 設定 joined=true）才顯示 Hi -->
  <h2 th:if="${joined}">Hi <span th:text="${username}">ユーザ</span>！</h2>

  <!-- Entry（ログインして /janken に入ったユーザ一覧） -->
  <div>
    <h3>エントリー</h3>
    <ul>
      <li th:each="u : ${entries}" th:text="${u}">user</li>
    </ul>
    <p style="font-size: 0.9em; color: #666;">※ もう一つのブラウザやシークレットウィンドウで別アカウントでログインすると複数名が表示されます。</p>
  </div>

  <!-- まだ出していない時：手の選択 -->
  <div th:if="${result} == null" style="margin-top:1rem;">
    <p>あなたの手を選んでください：</p>
    <form th:action="@{/janken/play}" method="post">
      <button type="submit" name="hand" value="グー">グー</button>
      <button type="submit" name="hand" value="チョキ">チョキ</button>
      <button type="submit" name="hand" value="パー">パー</button>
    </form>
  </div>

  <!-- 結果表示 -->
  <div th:if="${result} != null" style="margin-top:1rem;">
    <p>あなた：<strong th:text="${yourHand}"></strong></p>
    <p>相手：<strong th:text="${opponent}"></strong></p>
    <p>結果：<strong th:text="${result}"></strong></p>

    <p><a th:href="@{/janken}">もう一度</a></p>
    <p><a th:href="@{/index.html}">トップへ</a></p>
  </div>

</body>

</html>
